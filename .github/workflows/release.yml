name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress

      - name: Run acceptance gate
        shell: pwsh
        run: .\scripts\acceptance-v1.ps1

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($Version)) {
            throw "Unable to derive version from tag."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
          $Channel = if ($Version.Contains('-')) { 'beta' } else { 'stable' }
          "channel=$Channel" >> $env:GITHUB_OUTPUT

      - name: Package release
        shell: pwsh
        run: .\scripts\package-rc.ps1 -Version "${{ steps.version.outputs.version }}" -Channel "${{ steps.version.outputs.channel }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = "${{ steps.version.outputs.version }}"
          $Zip = "artifacts/SpriteForge-$Version-win-x64.zip"
          $Checksum = "$Zip.sha256"
          $Arguments = @(
            'release', 'create', "${{ github.ref_name }}",
            $Zip,
            $Checksum,
            'THIRD-PARTY-NOTICES.md',
            '--title', "SpriteForge $Version",
            '--generate-notes'
          )
          if ($Version.Contains('-')) {
            $Arguments += '--prerelease'
          }
          gh @Arguments
